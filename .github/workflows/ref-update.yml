# Brings the ref/ submodule (GoW5DB-Reference) up to its newest commit: every day at 04:00 UTC, or by hand
# (Actions > Reference update > Run workflow). When ref/ moved, it commits the new pin to the branch and redeploys
# the site (a push made by the workflow's own token doesn't start the Deploy workflow by itself).
name: Reference update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ref-update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true

      - name: Update ref/ to the newest GoW5DB-Reference commit
        id: bump
        run: |
          set -e
          old=$(git rev-parse HEAD:ref)
          git submodule update --init --remote ref
          new=$(git -C ref rev-parse HEAD)
          if [ "$old" = "$new" ]; then
            echo "ref/ is already at the newest commit (${old:0:7}), nothing to do."
            echo "- **No change:** ref/ is already at ${old:0:7}." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          log=$(git -C ref log --oneline "$old..$new")
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add ref
          git commit -m "Reference: update to ${new:0:7}" -m "$log"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          {
            echo "### ref/ updated: ${old:0:7} → ${new:0:7}"
            echo '```'
            echo "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
