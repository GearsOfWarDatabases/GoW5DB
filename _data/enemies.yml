      - { name: "Elite",   energy_other: 795, energy_master: "~398", weapon: "[[claw-lmg]]",    color: Red }
      - { name: "Lambent", energy_other: 185, energy_master: 93,    weapon: "[[hammerburst]]", color: Yellow }

  - name: Cyclops
    energy_other: 280
    energy_master: 140
    weapon: "[[lancer]]"
