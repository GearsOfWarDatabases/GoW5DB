# ── Fabricator ──────────────────────────────────────────────────────────────
# Items in exact Fabricator order (grid, left to right, top to bottom).
# Prices in Energy. Fortifications get 15% off for Engineer classes
# (Mechanic, Robotics Expert, Architect) - shown in-game as (-15%).
# Fortification levels 1-4: LV1's price/engineer is the FRESH BUILD cost,
# sourced from the Fabricator's own build menu (confirmed via
# "Barrier LV1 (Menu 1700).jpg" etc, which lists all six fortifications'
# LV1 prices in one screen). LV2/LV3/LV4's price/engineer is the cost to
# upgrade INTO that level from the one before it, sourced from the field
# "<Name> LVn UPGRADE: <price>" prompt shown while standing at an
# ALREADY-BUILT fortification - confirmed directly by the site owner with a
# 4-screenshot sequence for Barrier: the Menu (LV1 build), then field
# prompts reading "BARRIER LV1 UPGRADE: 1,700" (= cost of 1->2),
# "BARRIER LV2 UPGRADE: 2,550" (= cost of 2->3), "BARRIER LV3 UPGRADE: 3,400"
# (= cost of 3->4). In other words the field prompt's "LVn" names the level
# you're STANDING AT, not the level the price buys - the price takes you to
# LVn+1. This shifted every fortification's price/engineer down one level
# from an earlier layout (LV2's old price became LV1's own upgrade cost -
# coincidentally often identical since the first upgrade tends to cost the
# same as the initial build - LV3's old price became LV2's, LV4 which used
# to be an unconfirmed "MAX"/"?" now gets what used to be stored as LV3's
# price). '?' = not yet captured in-game. HP and buyback are NOT affected by
# this shift - they were always tied directly to the level they're shown
# under, independent of price.
# HP = max fortification health at that level, verified with no "Fortification
# Health" perk active (perk-inflated readings were divided back down, e.g. a
# Forge seen at 2,600/30%-perk HP -> 2,600 / 1.3 = 2,000 true base HP).
#
# modifiers: optional price modifiers for Fortifications only (Weapon prices
# never change). "cheaper" modifiers reduce cost, "expensive" ones raise it.
# The Fabricator page lets visitors toggle these to see the resulting price;
# the numbers below are also hardcoded in fabricator/index.html's calculator
# script, so update both places if a value ever changes. "cheaper" and
# "expensive" stack ADDITIVELY (all percentages summed once against the base
# price), not multiplicatively/chained - confirmed against a real Fabricator
# screenshot: Mechanic with Efficient Fabrication maxed (-32%) + Engineer
# (-15%) + Power Drain (+50%) active showed a price that only matches
# base * (1 - 0.15 - 0.32 + 0.50), not the chained version.
#
# hp_perk: the "Fortification Health" D-pad Perk (not a skill card - this is
# the small 4-option Perk wheel every class has, separate from the big cards
# above). Confirmed identical across all three Engineer classes
# (_classes/mechanic.md, robotics-expert.md, architect.md all list the same
# 10 values), so it's kept here once instead of duplicated per class. Applies
# on top of a fortification's base `hp` at whichever level is selected.

