# ── Maps ───────────────────────────────────────────────────────────────────
# Grouped exactly as in-game. One map per entry, with the game it originally
# debuted in (shown as a badge on the map card and in the expanded view).
# Map images: drop TWO files per map into images/maps/, named from the
# slugified map name (e.g. "Blood Drive" -> blood-drive):
#   images/maps/<slug>.jpg         - big image, shown in the click-to-expand modal
#   images/maps/<slug>-small.jpg   - small image, shown in the grid thumbnail
#   images/maps/<slug>-layout.jpg  - optional named top-down callout diagram,
#                                    toggled in the modal via "Show In-Game Map"
#                                    (only Icebound, River, Blood Drive, Vasgar,
#                                    Foundation, District, Allfathers Arena,
#                                    Abyss, Asylum, Command, Harbor, Gridlock,
#                                    and Clocktower have one captured so far)
# Only maps in the "PVP and PVE (Horde)" group are clickable to open the big
# image; "PVE (Escape)" cards render as static thumbnails. Missing images
# render nothing (no placeholder) so gaps are easy to spot at a glance - see
# maps/index.html's onerror.
