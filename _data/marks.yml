# ── Marks ────────────────────────────────────────────────────────────────
# Cosmetic banner Marks, collected from the in-game MARKS menu (own Q/E tab
# next to CLASSES/WEAPONS - not the STORE, despite marks also turning up as
# included rewards inside a few real-money Bundles, e.g. "EPIC MARK x1" in
# the Operation 8 Bundle). This is a PARTIAL catalog: only two screenshots
# of the grid have been captured so far (12 marks total, in-game rows below
# these were cut off in both captures), sorted automatically by the `marks`
# section in ref/sort-screenshots.py. Icons are cropped directly from those
# screenshots (images/marks/<slug>.png) - see ref/Marks/ for the originals.
#
# `border` is the color of each card's own border in the MARKS menu, which
# visibly groups into 4 colors. Two are cross-checked against real on-screen
# text (the Operation 8 Bundle screenshot lists included rewards color-coded
# by rarity: "RARE SKIN" in cyan, "EPIC MARK"/"EPIC BANNER"/etc in magenta -
# matching two of these border colors exactly), so those two are labeled
# with a real rarity name. The other two (gold, plain blue) have no matching
# on-screen rarity text anywhere captured yet, so `rarity` is left "?" for
# them rather than guessed - `border` still records what's visibly true.
list:
