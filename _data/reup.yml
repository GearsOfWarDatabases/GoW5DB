# Gears 5 RE-UP rewards + XP curve - all 60 RE-UPs, fully confirmed from a
# single source (unlike Honor, which is still partial - see
# classes/index.html #honor-debug). Source:
# https://gearsutility.com/gears-5/re-up-rewards
#
# Each RE-UP is one full character-level "prestige" reset (Level 1-100,
# reset back to 1 on completion): xp_per_level is the flat XP required for
# every character level within that RE-UP's cycle, and total_xp is the
# full amount needed to complete the whole RE-UP (not an exact multiple of
# xp_per_level - taken as-is from the source rather than recomputed).
# Both are pre-formatted strings with commas already applied, same
# convention as _data/leveling.yml's own xp column.
