---
layout: default
---
<div class="section-page">
  <div class="section-page__header">
    <h1 class="section-page__title">{{ page.title }}</h1>
  </div>
  {%- if page.coming_soon %}
  <div class="section-page__placeholder">
    <span class="section-page__placeholder-icon">&#9881;</span>
    <p>Content coming soon.</p>
  </div>
  {%- endif %}
  {{ content }}
</div>
